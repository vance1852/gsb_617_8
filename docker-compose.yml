services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-shortlink}
      POSTGRES_USER: ${DB_USER:-shortlink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shortlink123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-shortlink} -d ${DB_NAME:-shortlink}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-shortlink}
      DB_USER: ${DB_USER:-shortlink}
      DB_PASSWORD: ${DB_PASSWORD:-shortlink123}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
